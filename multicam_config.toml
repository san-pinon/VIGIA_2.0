# multicam_config.toml — VIGIA 2.0 reference configuration
#
# This file documents every instrument section, including those whose
# drivers are not yet fully implemented.  Copy to
# ~/.config/multicam_config.toml (default search path) and adjust
# paths and parameters for your deployment.
#
# Status tags used in this file:
#   IMPLEMENTED   — driver is complete and in use
#   WIP           — driver skeleton exists, under active development
#   NOT IMPLEMENTED — section reserved; driver not yet written

# ---------------------------------------------------------------------------
# System-level metadata
# ---------------------------------------------------------------------------

[metadata]
vnum         = 341090          # Volcano number (VNUM catalogue)
site_code    = "TLA"           # Short site identifier
data_archive = "/home/user/data"

# ---------------------------------------------------------------------------
# Infrared camera — Optris Pi 640                          IMPLEMENTED
# Interface: USB 3.0 via irdirectsdk (ctypes)
# ---------------------------------------------------------------------------

[infrared]
model       = "optris"
xml_path    = "/usr/share/libirimager/24062074_imager.xml"  # Imager config XML — NOT the cali data file.
                                                              # Generate base with: ir_generate_configuration <serial> > /usr/share/libirimager/<serial>_imager.xml
                                                              # Then apply Step 43 in test-snippets.md to set fov, temperature range, tchipmode=0,
                                                              # and focus=0 (infinity — camera deployed 4 km from crater).
log_path    = "/home/user/logs/thermal"
framerate   = 24     # Hz — frames per second requested
frame_count = 1     # Number of frames captured per invocation
# Measuring range: set in the imager XML <temperature> <min>/<max>; this unit (Cali-24062074.xml)
# has -20…100 (reads down to -40 with enable_extended_temp_range=1), 0…250 (no extension below 0)
# and 150…900 (down to 20 extended). Read at start-up and saved in every IR metadata file; the
# saturation check uses its top. t_max only overrides that top:
# t_max     = 250.0                # °C
saturation_pixel_threshold = 0.05  # Fraction of pixels at T_max to trigger warning
colourmap_min_c = -10.0            # °C — fixed min for false-colour PNG
colourmap_max_c = 60.0             # °C — fixed max for false-colour PNG
# --- `capture infrared-video` (continuous radiometric capture) ---
video_frame_count = 120  # Frames recorded per video run
video_rate_hz     = 1.0  # Target capture rate (field: 1 Hz, SBC 2026-06). The imager XML `framerate` MUST be >= this
                         # (software throttles by wall clock; it can only slow down, not speed up).
nuc_interval_s    = 0    # Seconds between NUC shutter calibrations during a BURST run.
                         # 0 = NUC once at start only. Field-measured (2026-06-22, SBC):
                         # the initial NUC after USB init costs ~11.5 s, but every periodic
                         # mid-run NUC is only ~1 s — so mid-run NUCs are essentially free and
                         # you can afford a short interval. Tune from real field timings,
                         # e.g. 1800 for 30 min. Each NUC freezes the scene for its duration
                         # and inserts a ~2 s gap in the frame stream (logged per run).
                         # NOTE: monitor mode (--monitor) ignores this and uses the
                         # temperature-triggered NUC keys below instead.
# --- `capture infrared-video --monitor` (continuous 24/7 monitor) ---
# Runs forever at video_rate_hz, emitting one file set per tumbling window. Frames are taken
# on round UTC multiples of 1/video_rate_hz and windows start on round UTC multiples of
# monitor_window_s (10 → :00, :10, …), so IR lines up with the UV/visible captures.
# Per window: a .npz of the kept frames, a baseline colour .png (dashboard quick-look,
# see monitor_png_interval_s) and a metadata .json with stats for EVERY frame (kept or
# not). monitor_keep picks what is kept (the trigger keys below apply to "activity").
monitor_window_s   = 10     # Seconds per output window (tumbling, non-overlapping).
monitor_keep       = "baseline"  # "baseline": keep one frame per window (its first valid frame,
                                 # on the round 10 s tick); in-between frames only feed the NUC
                                 # logic and the per-frame stats. "activity": also keep frames
                                 # that clear the trigger below.
monitor_png_interval_s = 60  # Colour quick-look PNG only for windows starting on a multiple of
                             # this (s); 0 = every window.
monitor_bg_percentile = 20  # Percentile of the ROI used as the per-frame ambient/background.
monitor_delta_c    = 8.0    # °C above ambient a pixel must exceed to count as "hot".
monitor_min_pixels = 25     # Keep a frame if this many ROI pixels are over-ambient.
monitor_abs_max_c  = 0.0    # Optional: also keep if frame ROI max temp >= this (0 = disabled).
# monitor_roi      = [x0, y0, x1, y1]   # Optional crop (e.g. crater only); omit for full frame.
# --- Temperature-triggered NUC (monitor mode) — minimises shutter actuations ---
nuc_drift_c        = 0.5    # Re-NUC once the chip temp drifts this far (°C) since the last NUC.
                            # Field test 2026-06-22: ~0.5 °C drift took ~176 s after power-on.
nuc_min_interval_s = 120    # Hard floor between NUCs (protects the shutter from oscillating chip temp).
nuc_max_interval_s = 1800   # Safety ceiling: force a NUC after this many seconds (0 = disabled).
                            # Needed with the imager XML's <autoflag><enable>0 (2026-10-21): the SDK
                            # then never flags by itself. The metadata chip temperature is the real
                            # sensor even with tchipmode = 2, so the drift trigger above works.

# ---------------------------------------------------------------------------
# Visible-spectrum camera                                  IMPLEMENTED (picam)
#                                                          WIP (canon)
# model = "v4l2"   → USB/UVC camera via V4L2 / OpenCV VideoCapture (SBC)
# model = "canon"  → Canon DSLR via python-gphoto2
# ---------------------------------------------------------------------------

[visible]
model       = "v4l2"    # "v4l2" | "canon"
framerate   = 5
frame_count = 10
camera_port = 2             # /dev/videoN index — Arducam is at /dev/video2 (video0-1 = Optris)
expected_card_name = "Arducam"  # V4L2 card name substring — prevents capturing from wrong device
# Output goes to {data_archive}/picam/receive/ (shared with DSLR metering frames)
# width  = 4056         # optional: force capture resolution (v4l2 only)
# height = 3040         # optional: force capture resolution (v4l2 only)

[visible.controls]
# libcamera control overrides (picam only).  Key names match the
# libcamera Controls enum (e.g. Saturation, Brightness, ExposureTime).
Saturation = 0.0

[visible.canon]
# Settings applied via python-gphoto2 config widgets (canon only).
iso          = 800
shutterspeed = "1/500"  # gphoto2 shutterspeed string
aperture     = "5.6"    # gphoto2 aperture string

# ---------------------------------------------------------------------------
# Ultraviolet camera pair — Dual Raspberry Pi Camera      IMPLEMENTED
# Filters: 310 nm (camera_1) and 330 nm (camera_2)
# Interface: MIPI-CSI via picamera2
# ---------------------------------------------------------------------------

[ultraviolet]
model              = "picam"
framerate          = 0.5     # Hz
frame_count        = 1
camera_1_port      = 0       # Confirmed in field test: port 0 → 310 nm, port 1 → 330 nm
camera_2_port      = 1
camera_1_filter_nm = 310     # Wavelength of the filter on camera_1 (nm)
camera_2_filter_nm = 330     # Wavelength of the filter on camera_2 (nm)
start_delay_s      = 0.5     # Warm-up delay after camera start() before first capture
# Exposure per camera, in milliseconds. The filters pass very different amounts
# of light, so each camera needs its own exposure to avoid saturating.
# uv-sync auto-adjusts each camera to keep its bright end (99.9th percentile of the
# raw image, above black level) at 20–80 % of full scale, and remembers the last
# good values; editing a value here makes it start from the new value again.
camera_1_exposure_ms = 1400     # 310 nm
camera_2_exposure_ms = 300      # 330 nm
max_exposure_ms      = 2575     # Ceiling for auto-adjust (both cameras); ≥ the top ladder rung
# The OV5647 dark offset is flat up to ~1000 ms but wanders above it, except on a
# few narrow flat spots. Auto-exposure is continuous up to continuous_max_ms and
# above it uses only the ladder values (set on the flat spots), so every long
# frame has a matching dark. Omit exposure_ladder_ms to allow any exposure.
continuous_max_ms    = 1000
exposure_ladder_ms   = [1700, 2100, 2575]
settle_frames        = 1        # Frames are flagged "settling" until this many exposures after a change
# Measured black level (DN, 10-bit) per exposure, from the dark library: rows of
# [exposure_ms, offset]: each row applies at its exposure (±1 ms), the first row also to
# everything shorter; other exposures fall back to libcamera.
# Without them black_level_dn is libcamera's fixed 16. Fill in from the I9 dark library;
# B-bis values for camera 1 (camera 2 at 2100/2575 still to measure in the normal state):
# camera_1_black_levels = [[1000, 17.70], [1700, 14.57], [2100, 16.03], [2575, 15.35]]
# camera_2_black_levels = [[1000, 15.59], [1700, 13.45]]
analogue_gain        = 1        # Locked for both cameras; auto-exposure/auto-gain are disabled
# Images are the sensor's 10-bit RAW Bayer data (linear, no ISP processing), saved
# in .npz as uint16 with the black level (not subtracted), exposure and binning.
raw_format           = "SGBRG10"  # Unpacked 10-bit; "SGBRG10_CSI2P" (packed) also works
binning              = 4        # Sum NxN pixels (uint16; /N² = mean): 1 (full 2592x1944), 2, 4 (648x486) or 8
quicklook_png        = true     # Also save 8-bit PNG previews (viewing only); see [uv_sync] quicklook_interval_s

[ultraviolet.controls]
# Extra libcamera control overrides applied to both UV cameras.
# Exposure and gain are set above — ExposureTime/AnalogueGain/AeEnable here are ignored
# (a legacy ExposureTime in µs is only used if camera_N_exposure_ms is missing).

# ---------------------------------------------------------------------------
# Spectrometer — OceanInsight OceanHR4                     IMPLEMENTED
# USB ID: 0999:1002  |  Device confirmed on RPi5 at /dev/bus/usb/003/002
# Interface: USB via seabreeze (pyseabreeze backend)
# Confirmed limits: integration time 3.8–10000 ms (3800–10000000 µs), bit_depth=16
# ---------------------------------------------------------------------------

[spectrometer]
model               = "oceaninsight"
integration_time_ms = 400.0    # ms — device range 3.8–10000 ms (uv-sync auto-adjusts and remembers it)
stacking            = 5        # Number of spectra averaged per measurement
frame_count         = 1        # Measurements per CLI invocation
framerate           = 0.016    # Hz (~1 measurement per minute)

# ---------------------------------------------------------------------------
# Environmental sensors                                    IMPLEMENTED (driver)
#
# BME280 — temperature, pressure, relative humidity
#   Interface: I2C (smbus2) | Confirmed: bus 1, address 0x77 (SDO high) on RPi5
#
# SHT30  — temperature, relative humidity
#   Interface: I2C (smbus2) | Default address: 0x44 (ADDR low) / 0x45 (ADDR high)
#   Confirmed: detected at 0x44 on bus 1 after resoldering.
# ---------------------------------------------------------------------------

[environmental.bme280]
enabled  = true
i2c_bus  = 1       # Linux I2C bus number (/dev/i2c-1)
address  = 0x77    # SDO pin pulled high on this unit

[environmental.sht30]
enabled  = true
i2c_bus  = 1
address  = 0x44

[environmental]
sampling_interval_s = 60   # Seconds between readings (for daemon/loop use)

# ---------------------------------------------------------------------------
# GNSS timing antenna                                      SYSADMIN TASK
# RPi5 hosts the GPS, acts as NTP server. SBC syncs from RPi5 via NTP.
# No Python capture driver required — see TODO.md for chrony setup.
#
# Confirmed: GPS appears at /dev/ttyUSB0 on RPi5 (USB-UART bridge).
# RPi5 IP: 192.168.30.101
# ---------------------------------------------------------------------------

[gnss]
enabled  = true
port     = "/dev/ttyUSB0"
baudrate = 4800    # confirmed on RPi5 /dev/ttyUSB0

# ---------------------------------------------------------------------------
# UV-sync — synchronized UV cameras + spectrometer capture    IMPLEMENTED
# Runs on uvcam (RPi5). Uses threading.Barrier for simultaneous trigger.
# ---------------------------------------------------------------------------

[uv_sync]
output_dir    = "/home/user/data/uv/"
default_stack = 5       # Number of spectra to co-add
max_retries   = 3        # Saturation retry limit (single-shot mode)
# --- `capture uv-sync --monitor` (devices kept open, capture-uv-monitor.service) ---
monitor_interval_s    = 10    # Capture on round UTC multiples of this (s); same as IR
monitor_spec_budget_s = 4     # Monitor: max time per spectrum, (stack + 1 burn-in) × integration;
                              # fewer spectra co-added as integration grows, integration ≤ half of this
quicklook_interval_s  = 60    # Monitor: PNG previews only on the tick at each multiple of this (s)
min_sun_elevation_deg = 5     # Devices closed while the sun is below this
monitor_max_reopens   = 5     # Monitor: exit (code 1, systemd restarts it) after this many failed
                              # opens/reopens with no good capture in between; 0 = never
# Camera site for the daylight gate (decimal degrees, north/east positive).
# Without them the monitor captures day and night.
latitude  = 19.067043     # UV camera site, ~4000 m a.s.l.
longitude = -98.628232
# Crater centre (for later plume geometry): 19.023444, -98.622460, rim 5200–5400 m a.s.l.
# → ~4.9 km from the camera, bearing ~173° (SSE), ~14–16° above the horizon.

# ---------------------------------------------------------------------------
# DSLR — picam-metered Canon capture                          IMPLEMENTED
# Runs on multicam (SBC). Picam meters scene, Canon fires final shot.
# ---------------------------------------------------------------------------

[dslr]
output_dir           = "/home/user/data/dslr/"
picam_output_dir     = "/home/user/data/picam/"
target_p95           = 180    # Canon JPEG 95th-percentile grey level to aim for (of 255)
# Closed loop (`--meter-with previous`, what the orchestrator uses): each shot's p95 sets
# the next shot's exposure; state in output_dir/.canon_state.json (ignored when older than
# state_max_age_s → starts again from [visible.canon] iso/shutterspeed).
# Policy: ISO 100 up to blur_limit_s, then ISO up to max_iso, then shutter up to max_shutter_s
# (exposure + download must fit the orchestrator's ~25 s Canon timeout).
blur_limit_s         = 1.0
max_iso              = 6400
max_shutter_s        = 15
state_max_age_s      = 1800
# Arducam metering (`--meter-with picam`, manual use only):
max_meter_iterations = 8
calibration_stops    = 0.0    # tune in field: negative if Canon overexposes, positive if underexposes

# ---------------------------------------------------------------------------
# Orchestrator — scheduler + service supervisor                IMPLEMENTED
# Runs on uvcam (RPi5) as vigia-orchestrator.service. UV (uvcam) and IR (multicam) run
# as their own services, every 10 s ([uv_sync] monitor_interval_s, [infrared]
# monitor_window_s). The orchestrator fires the slower captures on round UTC multiples
# of their interval (a task still running at its next tick skips it) and checks the
# two services, starting them again if they are down.
# ---------------------------------------------------------------------------

[orchestrator]
schedule        = { dslr = 30, environmental = 60 }   # seconds, aligned to the UTC clock
night_schedule  = { dslr = 120 }   # slower while the sun is below night_sun_elevation_deg
                                   # (a multiple of the day interval; site = [uv_sync] lat/lon)
night_sun_elevation_deg = 3
supervise       = ["capture-uv-monitor.service", "multicam:capture-ir-video.service"]
supervise_interval_s = 60
supervise_restart    = true   # start a supervised unit that is inactive/failed (sudo -n)
multicam_host   = "192.168.30.150"
multicam_user   = "user"
remote_venv_bin = "/home/user/.venv/bin/multicamctl"
log_path        = "/home/user/logs/orchestrator.log"

# ---------------------------------------------------------------------------
# File monitor — receive/ → archive/ (scripts/file_monitor.py)  IMPLEMENTED
# Runs on both nodes as file-monitor.service.
# ---------------------------------------------------------------------------

[file_monitor]
transmit           = false  # true: also hard-link each archived file into {instrument}/transmit/
                            # (for telemetry; nothing clears transmit/ yet).
forward_to         = ""     # rsync destination for {data_archive}/*/archive/. uvcam:
                            # "user@192.168.30.150:/home/user/data"; multicam: "" (off).
                            # Files are removed here only once transferred.
forward_interval_s = 60
min_free_gb        = 5      # warn in the log when free space under data_archive drops below this
